name: Polaris Container Scan

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  container-scan:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t polaris-vulnerable-demo:latest .

      # Display Docker image
      - name: Show Docker image
        run: |
          docker images polaris-vulnerable-demo

      # Export Docker image
      - name: Export Docker image
        run: |
          docker save polaris-vulnerable-demo:latest | gzip > polaris-vulnerable-demo.tar.gz

          echo "Container archive:"
          ls -lh polaris-vulnerable-demo.tar.gz

      # Polaris SCA Container Scan
      - name: Polaris Container Scan
        id: polaris-scan

        # Allow the workflow to continue even if Bridge returns
        # a non-zero exit code due to detected issues/build-break policy.
        continue-on-error: true

        uses: blackduck-inc/black-duck-security-scan@v2

        with:
          polaris_server_url: ${{ secrets.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN_POC }}

          polaris_application_name: "gaja-impl-app"
          polaris_project_name: "Github-Actions-Container-Scan"

          polaris_assessment_types: "SCA"
          polaris_test_sca_type: "SCA-CONTAINER"

          polaris_artifactToUpload: "polaris-vulnerable-demo.tar.gz"
          polaris_container_name: "polaris-vulnerable-demo"

      # Optional final step so the demo clearly shows completion
      - name: Container scan completed
        run: |
          echo "Polaris container scan completed."
          echo "Review the detected vulnerabilities in Polaris."
